# Windows builds for x64 and arm64: a per-user MSI installer and a portable zip each.
# Every push to master builds and tests them (downloads under the run's artifacts). To attach them to
# a release, run the workflow by hand with the release tag, or publish a release.
name: Windows

on:
  push:
    branches: [master]
    paths: ['projectlibre_*/**', '.github/workflows/windows.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to attach the Windows downloads to (empty to only build)
        required: false

permissions:
  contents: read

jobs:
  jar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the app and the packaging inputs
        working-directory: projectlibre_build
        run: ant -q jpackage-msi
      - uses: actions/upload-artifact@v4
        with:
          name: jpackage-msi
          path: projectlibre_build/packages/jpackage-msi

  windows:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2022, java-arch: x64 }
          - { arch: arm64, runner: windows-11-arm, java-arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jpackage-msi
          path: pkg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java-arch }}
      - name: WiX Toolset 3
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix.zip
          Expand-Archive wix.zip "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" >> $env:GITHUB_PATH
      - name: Build
        run: pkg/make.ps1

      - name: Install, start, quit, uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "pkg/out-${{ matrix.arch }}/*.msi").Path
          New-Item -ItemType Directory test, test/control | Out-Null
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v test\install.log" -Wait -PassThru
          if ($p.ExitCode) { throw "msiexec /i exit code $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\ProjectLibre\ProjectLibre.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter ProjectLibre*.lnk | ForEach-Object { "start menu: $($_.FullName)" }

          # Open the sample, log which classes come from the CDS archive, and ask the running app for its window.
          $env:JAVA_TOOL_OPTIONS = "-Dprojectlibre.snapshotDir=$PWD\test\control -Xlog:class+load=info:file=$PWD\test\class-load.log"
          $app = Start-Process $exe -ArgumentList "`"$PWD\pkg\source\sample.pod`"" -PassThru
          Start-Sleep 40
          if ($app.HasExited) { throw "ProjectLibre quit with exit code $($app.ExitCode)" }
          Set-Content test/control/script.groovy @'
          def f = dev.windows().find { it instanceof javax.swing.JFrame && it.visible }
          out.println("window: " + f?.title + " " + f?.size)
          out.println("menus: " + f?.JMenuBar?.components?.findAll { it instanceof javax.swing.JMenu }*.text)
          out.println("os.arch: " + System.getProperty("os.arch") + ", java " + System.getProperty("java.runtime.version"))
          '@
          Start-Sleep 5
          New-Item test/control/request | Out-Null
          Start-Sleep 5
          Get-Content test/control/script.out
          Set-Content test/control/script.groovy 'System.exit(0)'
          if (-not $app.WaitForExit(60000)) { Stop-Process $app -Force; throw 'ProjectLibre did not quit' }
          Remove-Item Env:JAVA_TOOL_OPTIONS

          $loaded = Get-Content test/class-load.log | Where-Object { $_ -match 'source: ' }
          $shared = @($loaded | Where-Object { $_ -match 'shared objects file' }).Count
          "classes loaded: $(@($loaded).Count), from the CDS archives: $shared"
          if ($shared -lt 1000) { throw 'class data sharing is not working' }
          if (-not (Select-String -Quiet 'window: .*ProjectLibre' test/control/script.out)) { throw 'no ProjectLibre window' }
          if (-not (Select-String -Quiet "os.arch: ${{ matrix.java-arch == 'x64' && 'amd64' || 'aarch64' }}" test/control/script.out)) { throw 'wrong architecture' }

          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode) { throw "msiexec /x exit code $($p.ExitCode)" }
          if (Test-Path $exe) { throw 'still installed after uninstall' }
          'installed, started, opened the sample, quit and uninstalled'

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectLibre-windows-${{ matrix.arch }}
          path: pkg/out-${{ matrix.arch }}/*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-windows-${{ matrix.arch }}
          path: |
            test
            pkg/build-${{ matrix.arch }}/cds-control
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: gh release upload $env:TAG (Get-ChildItem "pkg/out-${{ matrix.arch }}/*").FullName --clobber -R ${{ github.repository }}
